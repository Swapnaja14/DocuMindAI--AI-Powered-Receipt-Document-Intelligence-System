# ==============================================================================
# DocuMind AI - Production Nginx Reverse Proxy & Static Asset Server
# Provides:
#   - TLS 1.2 / 1.3 HTTPS termination on port 443 with HSTS
#   - Automatic HTTP (port 80) to HTTPS (port 443) 301 redirection
#   - Single Page Application (SPA) HTML5 history routing
#   - Microservices reverse proxy to FastAPI backend (/api/)
#   - Request body upload buffer (15MB) and timeout protections (120s)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. HTTP Server (Port 80): Health probe & HTTPS redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Root directory for static health check
    root /usr/share/nginx/html;

    # Internal container and load balancer health probe
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Redirect all public HTTP traffic to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Port 443): SSL termination, SPA delivery, & API proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TLS / SSL Certificate Configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security & Transport Hardening Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression for Fast Network Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Cache static hashed assets produced by Vite (in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # API Reverse Proxy to FastAPI Backend Service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;

        # Upload limits and timeouts for document processing
        client_max_body_size 15M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    # Health Check Probe for Docker / Load Balancer
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so releases update immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
